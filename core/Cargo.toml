[package]
name = "kssw"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tsify = "0.5.5"
serde = { version = "1.0", features = ["derive"] }
wasm-bindgen = "0.2"
rand = { version = "0.8", features = ["small_rng"] }
rand_xoshiro = "0.4"
getrandom = { version = "0.2", features = ["js"] }